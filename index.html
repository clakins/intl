<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:16px/1.6 system-ui,sans-serif;background:var(--bg);color:var(--fg)}

.sx{font-weight:600;margin-left:6px}.sx.open{color:var(--ok)}.sx.closed{color:var(--no)}.sx.recurring,.sx.na{color:var(--gy)}

.tp{justify-content:flex-end}header h1{margin-top:28px}

<script>

intro:['Isi data kamu, lalu lihat program luar negeri yang paling cocok untukmu.','Fill in your details to see the programs that fit you best.'],
age:['Usia','Age'],grade:['Kelas','Grade'],major:['Jurusan','Major'],types:['Yang kamu minati','What interests you'],
fund:['Saya butuh program yang didanai','I need a funded program'],go:['Tampilkan pilihanku','Show my options'],
now:['Mungkin cocok untukmu','May fit you'],later:['Rencanakan untuk nanti','Plan for later'],none:['Belum ada yang cocok. Coba ubah pilihanmu.','No matches yet. Try changing your choices.'],
loc:['Lokasi','Location'],fl:['Pendanaan','Funding'],dur:['Durasi','Duration'],op:['Pendaftaran dibuka','Applications open'],cl:['Pendaftaran ditutup','Applications close'],
chk:['Cek situs resmi','Check official site'],visit:['Kunjungi situs program','Visit program website'],print:['Cetak / simpan PDF','Print / save PDF'],
prep:['Persiapan: yang bisa kamu lakukan sekarang','Get ready: what you can do now'],prepi:['Centang yang sudah kamu kerjakan. Daftar ini tersimpan di perangkatmu.','Tick what you’ve done. This list is saved on your device.'],yt:['Video tutorial','Tutorial videos'],web:['Situs resmi','Official site'],s1:['Isi usia, kelas, dan jurusanmu.','Enter your age, grade and major.'],s2:['Lihat program yang paling cocok, diurutkan untukmu.','See the programs that fit you best, ranked.'],s3:['Centang langkah persiapan dan kunjungi situs resmi.','Tick off the preparation steps and visit the official sites.'],cs:['Sudah ditutup','Closed'],ci:['Ditutup dalam','Closes in'],hari:['hari','days'],co:['Ditutup','Closes'],oo:['Dibuka','Opens'],foot:['Panduan awal, bukan jaminan kelayakan. Tanggal dan syarat berubah setiap tahun dan belum semuanya diverifikasi. Data dicek terakhir: 9 Nov 2026. Selalu cek situs resmi program sebelum mendaftar.','A starting guide, not a guarantee of eligibility. Dates and requirements change every year and not all have been verified. Data last checked: 9 Nov 2026. Always check the official site before applying.'],dt:['Syarat & persiapan','Requirements & preparation'],lvl:['Jenjang','Level'],dep:['Relevan untuk jurusan','Relevant departments'],mnote:['bukan syarat resmi','not an official requirement'],allm:['Semua jurusan','All departments'],agel:['Usia','Age'],agedef:['Syarat usia berbeda tiap periode. Cek pengumuman resmi.','Age rules differ each cycle. Check the official announcement.'],anl:['Catatan pendaftaran','Application notes'],ver:['Terakhir diverifikasi','Last verified'],nov:['Belum diverifikasi ulang','Not re-verified'],wn:['Waspada penipuan: daftar kerja ke luar negeri hanya lewat SISKOP2MI dan pengumuman resmi KP2MI. Jangan bayar calo, baca kontrak kerja, dan pastikan jenis visa sesuai pekerjaan.','Beware of scams: apply for overseas work only through SISKOP2MI and official KP2MI announcements. Never pay brokers, read your work contract, and make sure the visa type matches the job.'],hh:['Peluang Belajar & Kerja ke Luar Negeri','Study & Work Abroad Opportunities'],hs:['Temukan program belajar, magang, dan kerja di luar negeri untuk siswa SMK Wisudha Karya.','Find study, internship and work programs abroad for SMK Wisudha Karya students.'],b1:['Cari peluangku','Find my opportunities'],b2:['Lihat semua program','Browse all programs'],so:['Mulai ulang','Start over'],dh:['Direktori program','Program directory'],sr:['Cari program…','Search programs…'],pg:['program','programs'],fy:['Didanai','Funded'],fp:['Sebagian / bervariasi','Partial / varies'],allt:['Semua jenis','All types'],allf:['Semua pendanaan','All funding'],allc:['Semua negara','All countries'],dc:['Ini perkiraan, bukan kepastian kelayakan. Persyaratan dan jadwal resmi tetap harus kamu cek di situs program.','This is an estimate, not a confirmation of eligibility. You must still check the official requirements and schedule.'],
F:[['Tidak didanai','Not funded'],['Sebagian / bervariasi','Partial / varies'],['Didanai penuh','Fully funded'],['Layanan gratis','Free service'],['Digaji','Paid']],
wm:['Sesuai jurusanmu','Fits your major'],wt:['Sesuai minatmu','Matches your interest'],wf:['Didanai','Funded']};
const M=[['nkn',['Nautika Kapal Niaga — navigasi, anjungan & dek','Merchant Marine Nautical — navigation, bridge & deck']],['tkn',['Teknika Kapal Niaga — mesin kapal & pemeliharaan','Merchant Marine Engineering — ship engines & maintenance']],['mesin',['Teknik Mesin — mesin industri & manufaktur','Mechanical Engineering — industrial machinery & manufacturing']],['oto',['Teknik Otomotif — kendaraan & perawatan','Automotive Engineering — vehicles & maintenance']],['titl',['Teknik Ketenagalistrikan — instalasi & sistem tenaga','Electrical Power Engineering — electrical installations & power systems']],['tei',['Teknik Elektronika — rangkaian & otomasi','Electronics Engineering — circuits & automation']]];
const T=[['hs',['SMA di luar negeri','High school abroad']],['college',['Kuliah di luar negeri (S1/S2)','College abroad (undergrad/grad)']],['work',['Magang, pelatihan & kerja','Internship, apprenticeship & work']],['exchange',['Pertukaran pemuda','Youth exchange']]];
function fill(){document.documentElement.lang=['id','en'][L];$('#lg').textContent=['EN','ID'][L];
document.querySelectorAll('[data-k]').forEach(e=>e.textContent=U[e.dataset.k][L]);
const k=(id,h,v)=>{const s=$(id),p=s.value;s.innerHTML=h;if(p)s.value=p};
k('#age',[15,16,17,18,19,20].map(a=>`<option>${a}</option>`).join(''));
k('#grade',[10,11,12].map(a=>`<option>${a}</option>`).join(''));
k('#major',M.map(m=>`<option value="${m[0]}">${t(m[1])}</option>`).join(''));
const c=[...document.querySelectorAll('#types input:checked')].map(x=>x.value);
$('#types').innerHTML=T.map(x=>`<label class="o"><input type="checkbox" value="${x[0]}" ${c.includes(x[0])?'checked':''}><span>${t(x[1])}</span></label>`).join('');
if($('#out').innerHTML)go();else if(self.prep)prep();self.dir&&dir()}
const FG=c=>c?String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt())):'🌐',FD=['full','free','paidtrain','paidwork'];
const TY={scholarship:['Beasiswa','Scholarship'],exchange:['Pertukaran','Exchange'],training:['Pelatihan','Training'],employment:['Kerja','Employment'],advising:['Konsultasi','Advising'],certification:['Sertifikasi','Certification'],portal:['Portal lowongan','Job portal']};
const FU={full:['Didanai penuh','Fully funded'],partial:['Dibiayai sebagian','Partial funding'],free:['Gratis','Free'],paidtrain:['Pelatihan berupah','Paid training'],paidwork:['Kerja berupah','Paid employment'],self:['Biaya sendiri','Self-funded'],varies:['Bervariasi','Varies'],na:['Tidak berlaku','Not applicable']};
const SL={open:['Dibuka','Open'],closed:['Ditutup untuk siklus ini · cek periode berikutnya','Closed for this cycle · check the next round'],recurring:['Belum diumumkan / berulang','Not announced / recurring'],na:['Layanan, tanpa pendaftaran','Service, no application']};
const LV={hs:['SMA/SMK','High school'],ug:['S1 / D3','Undergraduate'],grad:['S2 / S3','Graduate'],adult:['Lulusan / dewasa','Graduates / adults'],any:['Semua jenjang','All levels']};
function ie(i){if(i.src.endsWith('.png'))i.src=i.src.slice(0,-3)+'jpg';else i.parentNode.textContent=i.dataset.f}
const iso=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')?new Date(s+'T23:59:59'):null;
function cd(p){const c=iso(p.cl);if(!c||p.st=='closed')return '';const k=Math.ceil((c-new Date())/864e5);return k<0?'':` · ${t(U.ci)} ${k} ${t(U.hari)}`}
function card(p,r){const f=FG(p.cc),mj=p.m=='*'?t(U.allm):p.m.map(k=>t(M.find(m=>m[0]==k)[1]).split(' (')[0]).join(', ');
return `<article class="c"><div class="lg"><img src="img/${p.id}.png" data-f="${f}" alt="" loading="lazy" onerror="ie(this)"></div><div><h3>${p.n}</h3><p class="mt">${f} ${t(p.loc)} · ${t(TY[p.type])} · ${t(FU[p.fund])} · <b class="sx ${p.st}">${t(SL[p.st])}${cd(p)}</b></p>${r.length?`<p class="r">${r.join(' · ')}</p>`:''}<p>${t(p.s)}</p>
<details><summary>${t(U.dt)}</summary><ul><li><b>${t(U.lvl)}:</b> ${t(LV[p.lv])}</li><li><b>${t(U.dur)}:</b> ${t(p.d)}</li><li><b>${t(U.dep)}:</b> ${mj} <small>(${t(U.mnote)})</small></li><li><b>${t(U.agel)}:</b> ${p.age?t(p.age):t(U.agedef)}</li>${p.nt?`<li><b>${t(U.anl)}:</b> ${t(p.nt)}</li>`:''}<li><b>${t(U.ver)}:</b> ${p.v||t(U.nov)}</li></ul><a href="${p.u}" target="_blank" rel="noopener">${t(U.visit)} →</a></details></div></article>`}
function go(e){setTimeout(()=>self.prep&&prep());if(e)e.preventDefault();
const age=+$('#age').value,gr=+$('#grade').value,mj=$('#major').value,ty=[...document.querySelectorAll('#types input:checked')].map(x=>x.value),fd=$('#fund').checked,now=[],later=[];
PROGRAMS.forEach(p=>{let ok;
if(p.t=='hs'){if(!p.g.includes(gr)||age<p.a[0]||age>p.a[1])return;ok=1}
else ok=p.o||(gr==12&&age>=p.a[0]&&(!p.a[1]||age<=p.a[1]));
if(ty.length&&!ty.includes(p.t))return;
const r=[];let s=p.h?1:0;
if(p.m!='*'&&p.m.includes(mj)){s+=3;r.push(t(U.wm))}else if(p.m=='*')s++;
if(ty.includes(p.t)){s+=2;r.push(t(U.wt))}
if(fd&&FD.includes(p.fund)){s+=2;r.push(t(U.wf))}
(ok?now:later).push([s,p,r])});
const sec=(h,a)=>a.length?`<h2>${t(h)}</h2>`+a.sort((x,y)=>y[0]-x[0]).map(x=>card(x[1],x[2])).join(''):'';

$('#f').onsubmit=go;$('#lg').onclick=()=>{L=1-L;fill()};fill();
</script><script src="programs.js"></script>
<script src="resources.js"></script><script>
const lab=x=>typeof x=='string'?x:t(x);
function prep(){const ty=[...document.querySelectorAll('#types input:checked')].map(x=>x.value),mj=$('#major').value;let d={};try{d=JSON.parse(localStorage.d||'{}')}catch(e){}

$('#prep').innerHTML=`<h2>${t(U.prep)}</h2><p><small>${t(U.prepi)}</small></p>`+a.map(r=>`<article class="c rs"><input type="checkbox" class="ck" data-id="${r.id}" ${d[r.id]?'checked':''}><div><h3>${t(r.n)}</h3><p>${t(r.s)}</p><p>${r.l.map(l=>l[0]=='yt'?`<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(t(l[1]))}" target="_blank" rel="noopener">▶ ${t(U.yt)}</a>`:`<a href="${l[1]}" target="_blank" rel="noopener">${lab(l[2]||U.web)} →</a>`).join(' · ')}</p></div></article>`).join('');
document.querySelectorAll('#prep input').forEach(i=>i.onchange=()=>{d[i.dataset.id]=i.checked;try{localStorage.d=JSON.stringify(d)}catch(e){}})}
let dL=-1;
function dir(){const ob=(id,o)=>{const p=$(id).value;$(id).innerHTML=o.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');$(id).value=p||o[0][0]};
if(dL!=L){dL=L;ob('#ft',[['',t(U.allt)],...Object.keys(TY).map(k=>[k,t(TY[k])])]);ob('#ff',[['',t(U.allf)],['y',t(U.fy)],['p',t(U.fp)]]);
ob('#fc',[['',t(U.allc)],...[...new Map(PROGRAMS.map(p=>[p.loc[1],p.loc])).values()].map(c=>[c[1],t(c)])]);$('#q').placeholder=t(U.sr)}
